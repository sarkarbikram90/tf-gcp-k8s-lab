name: "Security & IaC Scanning"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: "Gitleaks Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Gitleaks Action"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: "Trivy IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Run Trivy Vulnerability & Misconfig Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "0" # Warnings reported without failing non-blocking runs
          severity: "CRITICAL,HIGH"

  golden-path-kustomize-verify:
    name: "IDP Golden Path & Kustomize Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Validate Golden Paths, Tenant Overlays & Shift-Left Policies"
        run: |
          chmod +x scripts/platform/verify-platform-policies.sh
          ./scripts/platform/verify-platform-policies.sh

  go-service-verify:
    name: "Go Microservices Lint & Unit Tests (order-api & sre-copilot)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: "Verify order-api (go vet & go test -race)"
        working-directory: services/order-api
        run: |
          go vet ./...
          go test -v -race ./...

      - name: "Verify sre-copilot (go vet & go test -race)"
        working-directory: services/sre-copilot
        run: |
          go vet ./...
          go test -v -race ./...

      - name: "Run Standalone Multi-Service E2E Pipeline (order-api + sre-copilot + Markdown RCA)"
        run: |
          chmod +x scripts/local/kind-e2e-harness.sh
          ./scripts/local/kind-e2e-harness.sh standalone-test

  container-supply-chain-verify:
    name: "CKS Container Build, SBOM & Trivy Image Scan"
    runs-on: ubuntu-latest
    needs: [go-service-verify]
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Build Distroless Microservice Images (order-api & sre-copilot)"
        run: |
          docker build -t ghcr.io/sarkarbikram90/order-api:v1.4.2 services/order-api
          docker build -t ghcr.io/sarkarbikram90/sre-copilot:v1.1.0 services/sre-copilot

      - name: "Generate CycloneDX SBOM Attestation (order-api)"
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/sarkarbikram90/order-api:v1.4.2
          format: cyclonedx-json
          output-file: order-api.sbom.cdx.json
          upload-artifact: false

      - name: "Scan Distroless Image for CRITICAL/HIGH CVEs (Trivy)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/sarkarbikram90/order-api:v1.4.2"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
