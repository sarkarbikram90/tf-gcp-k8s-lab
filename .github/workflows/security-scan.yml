name: "Security & IaC Scanning"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: "Gitleaks Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Gitleaks Action"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: "Trivy IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Run Trivy Vulnerability & Misconfig Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "0" # Warnings reported without failing non-blocking runs
          severity: "CRITICAL,HIGH"

  golden-path-kustomize-verify:
    name: "IDP Golden Path & Kustomize Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Validate Golden Paths, Tenant Overlays & Shift-Left Policies"
        run: |
          chmod +x scripts/platform/verify-platform-policies.sh
          ./scripts/platform/verify-platform-policies.sh

  go-service-verify:
    name: "Go Microservices Lint & Unit Tests (order-api & sre-copilot)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: "Verify order-api (go vet & go test -race)"
        working-directory: services/order-api
        run: |
          go vet ./...
          go test -v -race ./...

      - name: "Verify sre-copilot (go vet & go test -race)"
        working-directory: services/sre-copilot
        run: |
          go vet ./...
          go test -v -race ./...
