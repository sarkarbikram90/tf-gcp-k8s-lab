name: "Security & IaC Scanning"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: "Gitleaks Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Gitleaks Action"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: "Trivy IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Run Trivy Vulnerability & Misconfig Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "0" # Warnings reported without failing non-blocking runs
          severity: "CRITICAL,HIGH"

  golden-path-kustomize-verify:
    name: "IDP Golden Path & Kustomize Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Validate Golden Paths & Tenant Overlays"
        run: |
          kubectl kustomize kubernetes/platform-barnacles > /dev/null
          kubectl kustomize kubernetes/golden-paths/web-service > /dev/null
          kubectl kustomize kubernetes/golden-paths/ai-agent-service > /dev/null
          for app_dir in kubernetes/apps/*/; do
            echo "Validating tenant workload: ${app_dir}"
            kubectl kustomize "${app_dir}" > /dev/null
          done
