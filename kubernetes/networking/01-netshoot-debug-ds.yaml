apiVersion: v1
kind: Namespace
metadata:
  name: net-lab
  labels:
    app.kubernetes.io/part-of: tf-gcp-k8s-lab
    pod-security.kubernetes.io/enforce: baseline
---
# DaemonSet deploying a lightweight network diagnostic pod on every worker node
# for inspecting DNS, TCP/UDP sockets, traceroute, and East-West latency.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: net-diag-agent
  namespace: net-lab
  labels:
    app: net-diag-agent
spec:
  selector:
    matchLabels:
      app: net-diag-agent
  template:
    metadata:
      labels:
        app: net-diag-agent
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: net-diag
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Network diagnostic agent started on node ${NODE_NAME} (Pod IP: ${POD_IP})"
              exec sleep 864000
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
