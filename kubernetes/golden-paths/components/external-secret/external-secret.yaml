# ==============================================================================
# Composable Add-On Brick: GCP Secret Manager ExternalSecret
# Pulls application secrets from Google Cloud Secret Manager via the platform's
# `gcp-secret-manager` ClusterSecretStore and refreshes every 1 hour.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workload-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: workload-runtime-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: app-runtime-credentials
