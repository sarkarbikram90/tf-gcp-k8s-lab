# ==============================================================================
# Golden Path Patch: AI Agent & RAG Service (Wired to Level 5 vLLM Gateway)
# Automatically injects OpenAI-compatible cluster discovery endpoints and tunes
# NGINX Ingress timeouts for Server-Sent Events (SSE) token streaming.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: OPENAI_API_BASE
              value: "http://llm-gateway-svc.ai-inference.svc.cluster.local:8080/v1"
            - name: LLM_MODEL_NAME
              value: "meta-llama/Llama-3.1-8B-Instruct"
            - name: LLM_REQUEST_TIMEOUT_SECONDS
              value: "120"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workload
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
