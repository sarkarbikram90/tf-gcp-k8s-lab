apiVersion: v1
kind: Secret
metadata:
  name: barnacles-auth-secret
  namespace: barnacles
type: Opaque
stringData:
  # In Level 3 Hardened environments, sync this from Google Secret Manager
  BARNACLES_AUTH_TOKEN: "k8s-prod-barnacles-ingest-token-change-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: barnacles-config
  namespace: barnacles
data:
  server.yaml: |
    # Barnacles Central Server Configuration (Kubernetes StatefulSet)
    server:
      address: ":8080"
      read_header_timeout: 5s
      read_timeout: 15s
      write_timeout: 15s
      idle_timeout: 60s
      max_body_bytes: 10485760 # 10MB
      web_dir: "./web"

    auth:
      enabled: true
      tokens:
        - ${BARNACLES_AUTH_TOKEN}

    tls:
      enabled: false
      cert_file: ""
      key_file: ""

    ingest:
      max_batch_events: 1000
      max_message_bytes: 1048576 # 1MB
      dedup_window: 5m
      dedup_capacity: 100000

    storage:
      directory: "/app/data/logs"
      sync_on_write: true

    stream:
      recent_events: 10000
      max_clients: 200
      client_buffer_size: 256
      ping_interval: 30s
      write_deadline: 5s

    retention:
      enabled: true
      max_size_gb: 8
      max_age_hours: 168 # 7 days
      check_interval: 10m

  agent.yaml: |
    # Barnacles Edge Agent Configuration (Kubernetes DaemonSet)
    agent:
      id: ${BARNACLES_AGENT_ID}
      host: ${BARNACLES_AGENT_HOST}
      metrics_address: ":9090"

    server:
      url: ${BARNACLES_SERVER_URL}
      token: ${BARNACLES_AUTH_TOKEN}
      timeout: 10s
      insecure_skip_verify: false
      compression: ${BARNACLES_COMPRESSION:-zstd}

    batch:
      max_events: 500
      flush_interval: 1s
      max_queue_events: 10000

    retry:
      initial_backoff: 1s
      max_backoff: 30s
      backoff_multiplier: 2.0
      max_retries: 0 # Infinite retry with exponential backoff + durable disk spool

    spool:
      enabled: true
      directory: "/app/data/agent-spool"
      max_size_mb: 1024 # 1GB crash-safe FIFO spool
      max_batch_events: 500

    sources:
      - name: kubernetes-pods
        path: "/var/log/pods/**/*.log"
        format: auto
        start_position: end
        tags:
          cluster: tf-gcp-k8s-lab
          collector: barnacles-daemonset
