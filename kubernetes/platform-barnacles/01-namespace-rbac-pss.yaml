apiVersion: v1
kind: Namespace
metadata:
  name: barnacles
  labels:
    app.kubernetes.io/name: barnacles
    app.kubernetes.io/part-of: barnacles-platform
    # Baseline enforced on namespace so DaemonSet hostPath log tailing is permitted
    # while barnacles-server StatefulSet runs with strict non-root securityContext
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: barnacles-server-sa
  namespace: barnacles
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: barnacles-agent-sa
  namespace: barnacles
---
# Least-privilege read-only ClusterRole so barnacles-agent can inspect node/pod metadata if needed
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: barnacles-agent-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: barnacles-agent-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: barnacles-agent-reader
subjects:
  - kind: ServiceAccount
    name: barnacles-agent-sa
    namespace: barnacles
