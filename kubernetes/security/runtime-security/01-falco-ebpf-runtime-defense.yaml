# ==============================================================================
# CKS Runtime Security: Falco Modern eBPF Syscall Detection & AIOps Alerting
# ==============================================================================
# Purpose:
#   Provides real-time Linux kernel syscall inspection using Falco's modern eBPF
#   probe (`modern_ebpf`, zero kernel module compilation required) to detect:
#     1. Interactive shells spawned inside running production / AI containers
#     2. Unauthorized reads of /etc/shadow or Kubernetes PKI keys
#     3. Runtime binary drift or package managers executed inside containers
#     4. Container escape attempts (nsenter, containerd.sock, host mounts)
#     5. Unexpected outbound network connections from air-gapped vLLM engines
#
# Hands-On CKS Lab Verification:
#   1. Deploy Falco:
#      kubectl apply -f kubernetes/security/runtime-security/01-falco-ebpf-runtime-defense.yaml
#   2. Trigger a simulated CKS violation in a test pod:
#      kubectl run cks-test --image=alpine:3.20 --restart=Never -- sleep 3600
#      kubectl exec cks-test -- sh -c "cat /etc/shadow > /dev/null || true"
#   3. Inspect the structured JSON syscall alert:
#      kubectl logs -n security-runtime -l app.kubernetes.io/name=falco -c falco | grep "CKS_ALERT"
#   4. Clean up test pod:
#      kubectl delete pod cks-test --force --grace-period=0
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: security-runtime
  labels:
    app.kubernetes.io/part-of: tf-gcp-k8s-lab
    # Falco requires privileged eBPF syscall tracing on host nodes
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-runtime
  namespace: security-runtime
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: tf-gcp-k8s-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco-runtime-metadata-reader
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: tf-gcp-k8s-lab
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "replicationcontrollers", "services", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco-runtime-metadata-reader
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: tf-gcp-k8s-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco-runtime-metadata-reader
subjects:
  - kind: ServiceAccount
    name: falco-runtime
    namespace: security-runtime
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-cks-config
  namespace: security-runtime
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: tf-gcp-k8s-lab
data:
  falco.yaml: |
    rules_files:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/rules.d/cks_custom_rules.yaml
    engine:
      kind: modern_ebpf
      modern_ebpf:
        cpus_for_each_buffer: 2
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    priority: notice
    buffered_outputs: false
    stdout_output:
      enabled: true
    http_output:
      enabled: true
      url: "http://sre-copilot.sre-copilot.svc.cluster.local:8080/webhook"
      user_agent: "falco-cks-runtime/0.39"
    webserver:
      enabled: true
      listen_port: 8765
      k8s_healthz_endpoint: /healthz
      prometheus_metrics_enabled: true

  cks_custom_rules.yaml: |
    # --------------------------------------------------------------------------
    # Custom CKS & AI Infrastructure Runtime Security Rules
    # --------------------------------------------------------------------------
    - list: shell_binaries
      items: [ash, bash, csh, ksh, sh, tcsh, zsh, dash]

    - list: package_mgmt_binaries
      items: [apt, apt-get, apk, dpkg, rpm, yum, dnf, pip, pip3]

    - list: container_escape_tools
      items: [nsenter, chroot, unshare, mount, insmod, modprobe]

    # Rule 1: Detect interactive shell spawned inside any running container
    - rule: CKS Terminal Shell Spawned in Container
      desc: >
        Detects an interactive shell (sh/bash/ash) spawned inside a running
        application or AI inference container (kubectl exec or RCE).
      condition: >
        spawned_process and
        container and
        proc.name in (shell_binaries) and
        not proc.pname in (runc, containerd-shim)
      output: >
        CKS_ALERT [ShellInContainer] Shell spawned inside container
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name container=%container.id
        image=%container.image.repository:%container.image.tag cmdline=%proc.cmdline
        parent=%proc.pname)
      priority: WARNING
      tags: [cks, runtime, mitre_execution, container_shell]

    # Rule 2: Detect reads of sensitive host credentials or Kubernetes PKI keys
    - rule: CKS Sensitive Credential or PKI File Read in Container
      desc: >
        Detects any process inside a container reading /etc/shadow, GCP metadata
        credentials, or Kubernetes control-plane PKI private keys.
      condition: >
        open_read and
        container and
        (fd.name = /etc/shadow or
         fd.name startswith /etc/kubernetes/pki/ or
         fd.name = /etc/kubernetes/admin.conf)
      output: >
        CKS_ALERT [SensitiveFileRead] Sensitive credential or PKI file read
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name file=%fd.name
        command=%proc.cmdline image=%container.image.repository)
      priority: CRITICAL
      tags: [cks, credential_access, mitre_credential_access, pki]

    # Rule 3: Detect runtime binary modification or package installation (Immutable Container Drift)
    - rule: CKS Container Drift Package Manager or Binary Write
      desc: >
        Detects package managers (apt, apk, pip) or writes to system binary
        directories (/bin, /sbin, /usr/bin) at runtime.
      condition: >
        (spawned_process and container and proc.name in (package_mgmt_binaries)) or
        (open_write and container and
         (fd.directory in (/bin, /sbin, /usr/bin, /usr/sbin, /usr/local/bin)))
      output: >
        CKS_ALERT [ContainerDrift] Runtime binary modification or package manager executed
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name
        cmdline=%proc.cmdline file=%fd.name image=%container.image.repository)
      priority: ERROR
      tags: [cks, immutable_infrastructure, drift, supply_chain]

    # Rule 4: Detect container escape attempts via host namespaces or CRI socket
    - rule: CKS Container Escape Attempt via Host Namespace or CRI Socket
      desc: >
        Detects execution of namespace escape tools (nsenter/unshare/insmod) or
        direct access to the host containerd socket from inside a container.
      condition: >
        container and
        ((spawned_process and proc.name in (container_escape_tools)) or
         ((open_read or open_write) and fd.name contains "containerd.sock"))
      output: >
        CKS_ALERT [ContainerEscape] Host namespace or CRI socket escape attempt
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name cmdline=%proc.cmdline
        file=%fd.name image=%container.image.repository)
      priority: CRITICAL
      tags: [cks, privilege_escalation, mitre_privilege_escalation, escape]

    # Rule 5: Detect unexpected outbound connections from vLLM AI Inference pods
    - rule: CKS Unauthorized Outbound Egress from vLLM Inference Engine
      desc: >
        vLLM inference pods should serve internal cluster requests and never
        initiate arbitrary outbound connections (protects against prompt-injected
        SSRF or model weight exfiltration).
      condition: >
        outbound and
        container and
        k8s.ns.name = "ai-inference" and
        k8s.pod.label.app = "vllm-engine" and
        not (fd.sip = "127.0.0.1" or fd.dport = 53 or fd.dport = 443)
      output: >
        CKS_ALERT [AIModelExfiltrationGuard] Unexpected outbound connection from vLLM pod
        (pod=%k8s.pod.name ns=%k8s.ns.name connection=%fd.name proto=%fd.l4proto
        dport=%fd.dport cmdline=%proc.cmdline)
      priority: CRITICAL
      tags: [cks, ai_security, vllm, exfiltration, zero_trust]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: security-runtime
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/component: runtime-security
    app.kubernetes.io/part-of: tf-gcp-k8s-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
        app.kubernetes.io/component: runtime-security
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8765"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: falco-runtime
      hostPID: true
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      containers:
        - name: falco
          image: falcosecurity/falco-no-driver:0.39.0
          imagePullPolicy: IfNotPresent
          args:
            - /usr/bin/falco
            - -c
            - /etc/falco/config/falco.yaml
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          env:
            - name: HOST_ROOT
              value: /host
            - name: FALCO_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http-metrics
              containerPort: 8765
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: falco-config
              mountPath: /etc/falco/config/falco.yaml
              subPath: falco.yaml
              readOnly: true
            - name: falco-config
              mountPath: /etc/falco/rules.d/cks_custom_rules.yaml
              subPath: cks_custom_rules.yaml
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: host-run-containerd
              mountPath: /host/run/containerd
              readOnly: true
      volumes:
        - name: falco-config
          configMap:
            name: falco-cks-config
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-run-containerd
          hostPath:
            path: /run/containerd
---
apiVersion: v1
kind: Service
metadata:
  name: falco-metrics
  namespace: security-runtime
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: tf-gcp-k8s-lab
spec:
  selector:
    app.kubernetes.io/name: falco
  ports:
    - name: http-metrics
      port: 8765
      targetPort: 8765
      protocol: TCP
