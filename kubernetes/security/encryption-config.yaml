apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      - aescbc:
          keys:
            - name: key1
              # In production, replace with a 32-byte base64-encoded secret key:
              # head -c 32 /dev/urandom | base64
              secret: c3VwZXItc2VjcmV0LWtleS1mb3ItZXJjcnlwdGlvbi1hdC1yZXN0Cg==
      - identity: {}
