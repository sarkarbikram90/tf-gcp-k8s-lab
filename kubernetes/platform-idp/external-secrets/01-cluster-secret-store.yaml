# ==============================================================================
# External Secrets Operator (ESO): GCP Secret Manager Integration
# Bridges `terraform/modules/secret-manager/` directly into Kubernetes tenant
# namespaces without storing static credentials in Git or Terraform state.
# Uses keyless GCP Compute Engine / Workload Identity authentication.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  labels:
    app.kubernetes.io/part-of: k8s-lab-idp
spec:
  provider:
    gcpsm:
      # Replace with your GCP project ID or patch via Kustomize environment overlay
      projectID: "k8s-lab-gcp-project"
  # Restricts this ClusterSecretStore to tenant namespaces and core platform services
  conditions:
    - namespaceSelector:
        matchLabels:
          idp.k8s-lab.internal/tenant: "true"
    - namespaces:
        - barnacles
        - ai-inference
