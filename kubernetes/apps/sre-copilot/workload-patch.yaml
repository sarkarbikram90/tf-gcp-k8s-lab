# ==============================================================================
# Developer Workload Intent (`sre-copilot`)
# Receives Alertmanager webhooks, correlates Barnacles OTLP container logs and
# Kubernetes Events, and synthesizes automated RCA reports via Level 5 vLLM.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
spec:
  template:
    spec:
      automountServiceAccountToken: true
      containers:
        - name: app
          image: ghcr.io/sarkarbikram90/sre-copilot:v1.1.0
          env:
            - name: APP_ENV
              value: "production"
            - name: BARNACLES_QUERY_ENDPOINT
              value: "http://barnacles-server.barnacles.svc.cluster.local:8080/api/v1/query"
            - name: PROMETHEUS_QUERY_ENDPOINT
              value: "http://prometheus-server.observability.svc.cluster.local:9090/api/v1/query"
            - name: RCA_TEMPLATE_FORMAT
              value: "sre-incident-report-v1"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workload
spec:
  minReplicas: 2
  maxReplicas: 5
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workload
spec:
  rules:
    - host: sre-copilot.k8s-lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workload
                port:
                  number: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workload-route
spec:
  hostnames:
    - "sre-copilot.k8s-lab.internal"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workload-secret
spec:
  dataFrom:
    - extract:
        key: gcp-sm-sre-copilot-production
