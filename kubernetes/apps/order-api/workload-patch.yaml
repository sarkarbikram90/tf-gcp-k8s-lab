# ==============================================================================
# Developer Workload Intent (`order-api`)
# Only declares application-specific parameters; Platform Engineering templates
# and Kyverno policies handle PSS securityContext, NetworkPolicies, PDB & SLOs.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
spec:
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/sarkarbikram90/order-api:v1.4.2
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_FORMAT
              value: "json"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workload
spec:
  minReplicas: 2
  maxReplicas: 8
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workload
spec:
  rules:
    - host: order-api.k8s-lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workload
                port:
                  number: 8080
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workload-secret
spec:
  dataFrom:
    - extract:
        key: gcp-sm-order-api-production
