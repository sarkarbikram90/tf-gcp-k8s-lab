# ==============================================================================
# Local Multi-Node kind Cluster Topology (1 Control Plane + 2 Workers)
# Mirrors the Level 1 CKA Lab 3-node layout at $0 cloud cost for local E2E
# verification of Golden Path microservices, Barnacles, vLLM CPU simulator,
# and sre-copilot Kubernetes Events + Markdown RCA synthesis.
# ==============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tf-gcp-k8s-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,topology.kubernetes.io/zone=us-central1-a"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
  - role: worker
    labels:
      workload-tier: general
      topology.kubernetes.io/zone: us-central1-b
  - role: worker
    labels:
      workload-tier: ai-inference
      topology.kubernetes.io/zone: us-central1-c
